name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Actualizar README
        run: echo "Actualizacion CI" >> README.md

  validate-dev:
    needs: update-readme
    runs-on: self-hosted

    steps:
      - name: Validar DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "DEV TOKEN CORRECTO"
          }
          else {
            Write-Error "DEV TOKEN INCORRECTO"
          }
